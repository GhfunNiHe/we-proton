name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      target_arch:
        required: true
        type: string

jobs:
  proton:
    name: Build ${{ inputs.name }}
    runs-on: ${{ inputs.target_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_codeql: true
          remove_docker_images: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-proton-${{ inputs.target_arch == 'arm64' && 'arm64-' || '' }}${{ github.run_id }}
          restore-keys: |
            ccache-proton-${{ inputs.target_arch == 'arm64' && 'arm64-' || '' }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Patch
        run: |
          git submodule update --init --filter=tree:0 --recursive
          # apply proton-ge-custom patches
          ./patches/protonprep-valve-staging.sh || true
          # strip binaries at compile time to save space in the runner
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          mkdir ./build

      - name: Configure
        working-directory: ./build
        run: |
          ../configure.sh --build-name=${{ inputs.name }} --target-arch=${{ inputs.target_arch }} --container-engine=docker

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          make -j$(nproc) redist

      - name: Dump build failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== dav1d Meson diagnostics ==="
          find build -path '*/obj-dav1d-*/meson-logs/meson-log.txt' -type f -print -exec cat {} \;
          echo "=== ONNX Runtime headers and archives ==="
          find build -type f -name 'onnxruntime_cxx_api.h' -print
          find build -type f -name 'onnxruntime_c_api.h' -print
          echo "=== ONNX Runtime archive contents ==="
          while IFS= read -r archive; do tar -tzf "$archive"; done < <(find build -type f -name 'onnxruntime-linux-*.tgz')
          echo "=== ONNX Runtime extracted files ==="
          while IFS= read -r dir; do find "$dir" -maxdepth 3 -type f -print; done < <(find build -type d -name 'onnxruntime-*')

      - name: Save cache
        id: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact ${{ inputs.name }}.tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.tar.gz
          path: ./build/${{ inputs.name }}.tar.gz

      - name: Upload artifact ${{ inputs.name }}.sha512sum
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.sha512sum
          path: ./build/${{ inputs.name }}.sha512sum

