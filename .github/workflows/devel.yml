name: Development

on: workflow_dispatch

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag_abbrev: ${{ steps.version.outputs.tag_abbrev }}
      tag_offset: ${{ steps.version.outputs.tag_offset }}
      sha_short: ${{ steps.version.outputs.sha_short }}
      full_desc: ${{ steps.version.outputs.full_desc }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Version
      id: version
      shell: bash
      run: |
        if tag_abbrev=$(git describe --tags --abbrev=0 2>/dev/null); then
          tag_offset=$(git rev-list "$tag_abbrev"..HEAD --count)
          full_desc=$(git describe --long --tags)
        else
          tag_abbrev=untagged
          tag_offset=$(git rev-list --count HEAD)
          full_desc="untagged-${tag_offset}-g$(git rev-parse --short HEAD)"
        fi
        echo "tag_abbrev=$tag_abbrev" >> $GITHUB_OUTPUT
        echo "tag_offset=$tag_offset" >> $GITHUB_OUTPUT
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "full_desc=$full_desc" >> $GITHUB_OUTPUT
        echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.target_arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            suffix: ""
          - target_arch: arm64
            suffix: "-aarch64"
    uses: ./.github/workflows/_job_build.yml
    with:
      name: ${{ needs.version.outputs.full_desc }}-${{ needs.version.outputs.branch }}${{ matrix.suffix }}
      target_arch: ${{ matrix.target_arch }}

